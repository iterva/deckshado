{% extends "cards/admin_base.html" %}
{% block content %}
<div class="panel">
  <h1>Carga masiva de ediciones</h1>
  <p class="muted">CSV soportado: myl_id, slug, title, format_code, season_code, image, active</p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Subir CSV</button>
  </form>
</div>
{% endblock %}
