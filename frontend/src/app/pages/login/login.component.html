<div class="auth-page">
  <div class="auth-card">
    <h2>Iniciar Sesión</h2>
    <p class="auth-subtitle">Accede al Constructor de Mazos</p>

    @if (error) {
      <div class="error-msg">{{ error }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input id="username" type="text" [(ngModel)]="username" name="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full" [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>
    </form>
    <p class="auth-link">¿No tienes una cuenta? <a routerLink="/register">Regístrate aquí</a></p>
  </div>
</div>
